name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  # Un seul groupe : deux tags proches ne doivent pas empaqueter en parallèle contre la même release précédente.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # Permissions au niveau du job : un futur job n'en héritera pas.
    permissions:
      contents: write
      actions: read # SignPath lit l'artefact non signé du job
      id-token: write # jeton OIDC pour le certificat Sigstore des attestations
      attestations: write # enregistrement des attestations de provenance
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 (node24)
        with:
          dotnet-version: 8.0.x

      - name: Check tag matches app version
        id: version
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content src/Aion2Assistant.App/Aion2Assistant.App.csproj -Raw)
          $version = ($csproj.Project.PropertyGroup.InformationalVersion | Where-Object { $_ } | Select-Object -First 1)
          if (-not $version) { throw 'InformationalVersion introuvable dans Aion2Assistant.App.csproj' }
          if ("v$version" -ne $env:TAG) { throw "Le tag $env:TAG ne correspond pas a la version de l'app (v$version)" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish src/Aion2Assistant.App/Aion2Assistant.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      - name: Add license files
        shell: pwsh
        run: |
          Copy-Item LICENSE publish/LICENSE
          Copy-Item data/NOTICE.md publish/NOTICE.md
          Copy-Item README.md publish/README.md

      # --- Signature SignPath : active seulement quand la variable SIGNPATH_ORGANIZATION_ID est définie.
      - name: Upload unsigned build
        id: upload-unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: publish/
          if-no-files-found: error
          retention-days: 1

      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Chaque signature doit être approuvée à la main dans SignPath : on attend jusqu'à 1 h.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Use signed build
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($f in 'signed/Aion2Assistant.exe', 'signed/Aion2Assistant.dll') {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "Signature invalide sur $f : $($sig.Status)" }
          }
          $before = (Get-ChildItem publish -Recurse -File).Count
          $after = (Get-ChildItem signed -Recurse -File).Count
          if ($before -ne $after) { throw "Le build signé n'a pas le même nombre de fichiers ($after au lieu de $before)" }
          Remove-Item publish -Recurse -Force
          Move-Item signed publish

      # --- Paquets Velopack (vpk épinglé à la même version que le NuGet Velopack de l'app).
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { throw "Installation de vpk 1.2.161 impossible" }
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      # Base du delta. `vpk download github` (anonyme) a échoué en 0.3.5-beta.1 sur « 403 rate limit exceeded »
      # (IP partagées des runners GitHub) : on reproduit ce qu'il fait, avec le GITHUB_TOKEN du job.
      # `vpk download github` dépose dans le dossier de sortie releases.win.json et le dernier -full.nupkg ;
      # `vpk pack -o releases` lit ensuite les paquets présents dans ce dossier, prend la dernière release
      # COMPLÈTE de version inférieure comme base et génère le -delta.nupkg contre elle (sans base : paquet
      # complet seul). Le releases.win.json téléchargé est réécrit par vpk pack.
      # Sécurité : jamais un brouillon comme base (un brouillon resté d'un run échoué n'a pas été vérifié) ;
      # seules les releases publiées sont retenues, triées par date de publication (pas l'ordre de la liste :
      # la 0.3.4-beta.1 publiée sur « untagged-… » y apparaît hors ordre et reste une base valable).
      - name: Download previous Velopack release
        id: base
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = '${{ github.repository }}'
          New-Item -ItemType Directory -Force releases | Out-Null

          $json = @(gh api "repos/$repo/releases?per_page=100" --paginate --jq '.[] | select(.draft | not) | {id, tag_name, created_at, published_at, assets: [.assets[] | {id, name, size}]} | tojson')
          if ($LASTEXITCODE -ne 0) { throw "Lecture des releases GitHub impossible" }
          $published = @($json | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json -NoEnumerate })
          # ConvertFrom-Json convertit déjà les dates ISO en [datetime] ; [datetime] les normalise dans tous les cas.
          $candidates = @($published |
            Where-Object { @($_.assets.name) -contains 'releases.win.json' } |
            Sort-Object -Descending -Property @{ Expression = { [datetime]$(if ($_.published_at) { $_.published_at } else { $_.created_at }) } })

          # Les anciennes releases (zip 0.3.x) n'ont pas de releases.win.json : première release Velopack,
          # le pack sera alors complet, sans delta.
          if ($candidates.Count -eq 0) {
            Write-Host "Aucune release Velopack publiee (pas de releases.win.json) : premiere release Velopack, pas de delta."
            exit 0
          }
          $base = $candidates[0]
          if ($base.tag_name -eq $env:TAG) { throw "La release $env:TAG est deja publiee : rien a empaqueter." }
          Write-Host "Base du delta : release $($base.tag_name) (id $($base.id), publiee le $($base.published_at))"

          # Téléchargement d'un asset par son id (fonctionne aussi pour une release sur « untagged-… »,
          # que `gh release download <tag>` ne sait pas adresser). Le jeton n'est envoyé qu'à api.github.com :
          # PowerShell retire l'en-tête Authorization lors de la redirection vers le stockage des assets.
          function Get-ReleaseAsset([object] $asset) {
            $out = Join-Path releases $asset.name
            $headers = @{
              Authorization          = "Bearer $env:GH_TOKEN"
              Accept                 = 'application/octet-stream'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            Invoke-WebRequest -Uri "https://api.github.com/repos/$repo/releases/assets/$($asset.id)" -Headers $headers -OutFile $out -MaximumRetryCount 3 -RetryIntervalSec 5
            $len = (Get-Item $out).Length
            if ($len -ne $asset.size) { throw "Taille inattendue pour $($asset.name) : $len au lieu de $($asset.size)" }
            return $out
          }
          function Find-Asset([string] $name) { $base.assets | Where-Object { $_.name -ceq $name } | Select-Object -First 1 }

          $feedPath = Get-ReleaseAsset (Find-Asset 'releases.win.json')
          $feed = Get-Content $feedPath -Raw | ConvertFrom-Json
          $full = @($feed.Assets | Where-Object { $_.Type -eq 'Full' -and $_.PackageId -eq 'Aion2Assistant' } |
            Sort-Object -Descending -Property @{ Expression = { [System.Management.Automation.SemanticVersion]$_.Version } }) |
            Select-Object -First 1
          if (-not $full) { throw "releases.win.json de $($base.tag_name) ne reference aucun paquet complet Aion2Assistant" }
          # Nom de fichier issu d'un fichier téléchargé : on refuse tout ce qui n'est pas un simple nom de paquet.
          if ($full.FileName -notmatch '^[A-Za-z0-9._-]+-full\.nupkg$') { throw "Nom de paquet complet inattendu : '$($full.FileName)'" }
          $fullAsset = Find-Asset $full.FileName
          if (-not $fullAsset) { throw "La release $($base.tag_name) ne contient pas $($full.FileName), reference par son releases.win.json : base du delta introuvable" }
          $fullPath = Get-ReleaseAsset $fullAsset
          $hash = (Get-FileHash $fullPath -Algorithm SHA256).Hash
          if (-not $full.SHA256) { throw "releases.win.json de $($base.tag_name) ne donne pas de SHA-256 pour $($full.FileName) : base du delta non verifiable" }
          if ($hash -ne $full.SHA256) { throw "SHA-256 de $($full.FileName) different de releases.win.json ($hash au lieu de $($full.SHA256))" }

          $legacy = Find-Asset 'RELEASES'
          if ($legacy) { Get-ReleaseAsset $legacy | Out-Null }

          Write-Host "Base du delta : $($full.FileName) $($full.Version) (SHA-256 verifie)"
          "base=true" >> $env:GITHUB_OUTPUT
          Get-ChildItem releases | Format-Table Name, Length -AutoSize

      - name: Pack
        id: pack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE_DOWNLOADED: ${{ steps.base.outputs.base }}
        run: |
          # Icône du projet (logo du site) pour Setup.exe et les raccourcis.
          $icon = 'src/Aion2Assistant.App/app.ico'
          if (-not (Test-Path $icon)) { throw "Icone introuvable : $icon" }
          vpk pack -u Aion2Assistant -v $env:VERSION -r win-x64 -p publish -e Aion2Assistant.exe --packTitle Aion2Assistant --packAuthors nathantek -i $icon -o releases
          if ($LASTEXITCODE -ne 0) { throw "vpk pack a echoue" }
          $expected = @(
            'Aion2Assistant-win-Setup.exe',
            'Aion2Assistant-win-Portable.zip',
            "Aion2Assistant-$env:VERSION-full.nupkg",
            'releases.win.json',
            'RELEASES',
            'assets.win.json'
          )
          $missing = $expected | Where-Object { -not (Test-Path (Join-Path releases $_)) }
          if ($missing) { throw "Livrables vpk manquants : $($missing -join ', ')" }
          Get-ChildItem releases | Format-Table Name, Length -AutoSize

          # Sujets des attestations : uniquement les fichiers produits par CE pack. Pas de glob sur *.nupkg :
          # le -full.nupkg de la release précédente (base du delta) est aussi dans releases/ (et un glob
          # « -$VERSION-* » attraperait une 0.3.6-beta.1 en publiant la 0.3.6).
          $subjects = @(
            'releases/Aion2Assistant-win-Setup.exe',
            'releases/Aion2Assistant-win-Portable.zip',
            "releases/Aion2Assistant-$env:VERSION-full.nupkg"
          )
          if (Test-Path "releases/Aion2Assistant-$env:VERSION-delta.nupkg") {
            $subjects += "releases/Aion2Assistant-$env:VERSION-delta.nupkg"
          } elseif ($env:BASE_DOWNLOADED -eq 'true') {
            throw "Une base de delta a ete telechargee mais vpk pack n'a produit aucun -delta.nupkg"
          } else {
            Write-Host "Pas de delta.nupkg (premiere release Velopack)"
          }
          "subjects<<EOF_SUBJECTS" >> $env:GITHUB_OUTPUT
          $subjects >> $env:GITHUB_OUTPUT
          "EOF_SUBJECTS" >> $env:GITHUB_OUTPUT

      # Attestations de provenance (Sigstore) des livrables de cette version, avant leur envoi.
      # Vérification côté utilisateur : gh attestation verify <fichier> --repo nathantek/aion2assistant
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.subjects }}

      # Les releases immuables refusent tout ajout une fois publiées : la release est créée en BROUILLON,
      # complétée (sha256, notes), vérifiée, puis publiée EN DERNIER.
      - name: Upload Velopack release (draft)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Toutes nos releases sont des pré-versions ; le tag est déjà poussé. Pas de --publish : brouillon.
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --pre --tag $env:TAG --releaseName $env:TAG --token $env:GH_TOKEN -o releases
          if ($LASTEXITCODE -ne 0) { throw "vpk upload a echoue" }

      - name: Checksums, notes, verify and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $repo = '${{ github.repository }}'

          # Un brouillon n'est pas fiable à adresser par tag avec gh : on résout son id via l'API.
          $ids = @(gh api "repos/$repo/releases?per_page=100" --paginate --jq ".[] | select(.draft and .tag_name == `"$env:TAG`") | .id")
          if ($LASTEXITCODE -ne 0) { throw "Lecture des releases GitHub impossible" }
          if ($ids.Count -ne 1) { throw "Attendu : exactement 1 brouillon pour $env:TAG, trouvé : $($ids.Count)" }
          $id = $ids[0]

          $files = 'Aion2Assistant-win-Setup.exe', 'Aion2Assistant-win-Portable.zip'
          New-Item -ItemType Directory -Force checksums | Out-Null
          $lines = @()
          foreach ($f in $files) {
            $path = Join-Path releases $f
            if (-not (Test-Path $path)) { throw "Livrable manquant : $f" }
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash
            "$hash  $f" | Set-Content -Encoding ascii "checksums/$f.sha256"
            $lines += "- ``$f`` : ``$hash``"
          }

          # Envoi des .sha256 sur le brouillon (API d'envoi par id de release).
          foreach ($f in $files) {
            $name = "$f.sha256"
            gh api --method POST "https://uploads.github.com/repos/$repo/releases/$id/assets?name=$name" -H "Content-Type: text/plain" --input "checksums/$name" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Envoi de $name impossible" }
          }

          # Notes.
          $install = @(
            '## Installation',
            '',
            '- **Recommandé** : `Aion2Assistant-win-Setup.exe` (installation et mises à jour automatiques).',
            '- **Alternative** : `Aion2Assistant-win-Portable.zip` (version portable, à extraire dans un dossier ; se met aussi à jour automatiquement).',
            '- **Migration depuis l''ancien zip** : ferme d''abord l''ancienne version (icône de notification › Quitter), puis lance `Setup.exe`.',
            '',
            '## SHA-256',
            ''
          ) + $lines + @(
            '',
            'Vérification : `Get-FileHash .\<fichier>` doit afficher la même valeur.'
          )
          $notes = $install -join "`n"
          # Notes générées par GitHub (changements depuis la release précédente), facultatives.
          $generated = gh api "repos/$repo/releases/generate-notes" -f "tag_name=$env:TAG" --jq '.body'
          if ($LASTEXITCODE -eq 0 -and $generated) {
            $notes += "`n`n" + ($generated -join "`n")
          } else {
            Write-Host "Notes generees indisponibles, notes d'installation seules."
          }
          $notes | Set-Content -Encoding utf8 release-notes.md
          gh api --method PATCH "repos/$repo/releases/$id" -F "body=@release-notes.md" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Mise a jour des notes de release impossible" }

          # Vérifie que le brouillon contient exactement les livrables attendus.
          $expected = @(
            'Aion2Assistant-win-Setup.exe',
            'Aion2Assistant-win-Portable.zip',
            "Aion2Assistant-$env:VERSION-full.nupkg",
            'releases.win.json',
            'RELEASES',
            'Aion2Assistant-win-Setup.exe.sha256',
            'Aion2Assistant-win-Portable.zip.sha256'
          )
          if (Test-Path (Join-Path releases "Aion2Assistant-$env:VERSION-delta.nupkg")) {
            $expected += "Aion2Assistant-$env:VERSION-delta.nupkg"
          }
          $assets = @(gh api "repos/$repo/releases/$id" --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Lecture du brouillon impossible" }
          $missing = $expected | Where-Object { $assets -notcontains $_ }
          if ($missing) { throw "Le brouillon $env:TAG ne contient pas : $($missing -join ', ')" }
          $extra = $assets | Where-Object { $expected -notcontains $_ }
          if ($extra) { Write-Host "::warning::Le brouillon $env:TAG contient des fichiers non listes (non bloquant) : $($extra -join ', ')" }
          Write-Host "Assets verifies : $($assets -join ', ')"

          # Publication EN DERNIER (la release devient immuable).
          # tag_name explicite : la 0.3.4-beta.1, publiée à la main, s'est retrouvée sur un tag « untagged-… ».
          gh api --method PATCH "repos/$repo/releases/$id" -f "tag_name=$env:TAG" -F draft=false -F prerelease=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Publication de la release impossible" }
          $publishedTag = gh api "repos/$repo/releases/$id" --jq '.tag_name'
          $stillDraft = gh api "repos/$repo/releases/$id" --jq '.draft'
          if ($publishedTag -ne $env:TAG -or $stillDraft -ne 'false') {
            throw "Release publiee avec un etat inattendu : tag=$publishedTag draft=$stillDraft (attendu : $env:TAG, false)"
          }
          Write-Host "Release publiee sur $publishedTag"
